
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101720">
<title>Chess League</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="logo">♞</div>
  <div>
    <h1>CHESS LEAGUE</h1>
    <p>ТВОЯ ШАХМАТНАЯ АРЕНА</p>
  </div>
</header>

<main>

<section class="profile card">
  <div class="profile-top">
    <div>
      <span class="muted">ТВОЙ РЕЙТИНГ</span>
      <div class="rating" id="rating">0 ELO</div>
    </div>
    <div class="rank-icon">♛</div>
  </div>

  <div class="stats">
    <div><b id="wins">0</b><small>Победы</small></div>
    <div><b id="losses">0</b><small>Поражения</small></div>
    <div><b id="draws">0</b><small>Ничьи</small></div>
    <div><b id="games">0</b><small>Партии</small></div>
  </div>
</section>

<section class="card">
  <h2>ВЫБЕРИ СОПЕРНИКА</h2>
  <div id="bots" class="bots">

    <button class="bot active" data-bot="chatgpt">
      <span class="avatar">🤖</span>
      <span class="bot-info">
        <b>ChatGPT</b>
        <small>Почти гроссмейстер</small>
      </span>
      <span class="bot-elo">9999</span>
    </button>

    <button class="bot" data-bot="alifka">
      <span class="avatar">👃</span>
      <span class="bot-info">
        <b>Алифка</b>
        <small>Шахматный катастрофа</small>
      </span>
      <span class="bot-elo">-1</span>
    </button>

    <button class="bot" data-bot="alikhan">
      <span class="avatar">🧑🏻‍💻</span>
      <span class="bot-info">
        <b>Алихан</b>
        <small>Любитель шахмат</small>
      </span>
      <span class="bot-elo">400</span>
    </button>

    <button class="bot" data-bot="toxic">
      <span class="avatar">🫃</span>
      <span class="bot-info">
        <b>Токсик</b>
        <small>Играет неплохо</small>
      </span>
      <span class="bot-elo">250</span>
    </button>

    <button class="bot" data-bot="batik">
      <span class="avatar">🐶</span>
      <span class="bot-info">
        <b>Батик</b>
        <small>Мопс-шахматист</small>
      </span>
      <span class="bot-elo">20</span>
    </button>

  </div>
</section>

<section class="card game-card">
  <div class="game-top">
    <div>
      <span class="muted">ТВОЙ СОПЕРНИК</span>
      <h2 id="opponent">ChatGPT</h2>
    </div>
    <div id="game-status">Ожидание игры</div>
  </div>

  <div id="chessboard" class="chessboard"></div>

  <div class="game-buttons">
    <button class="main-btn" id="new-game">НОВАЯ ПАРТИЯ</button>
    <button class="secondary-btn" id="undo">↶ Назад</button>
    <button class="secondary-btn" id="flip">↻</button>
  </div>
</section>

<section class="card">
  <h2>ИСТОРИЯ ХОДОВ</h2>
  <div id="moves" class="moves">Партия ещё не началась.</div>
</section>

<section class="card">
  <h2>ПОСЛЕДНИЙ ОТЧЁТ</h2>
  <div id="report">
    <p class="muted">Здесь появится отчёт после партии.</p>
  </div>
</section>

</main>

<footer>
  CHESS LEAGUE · VERSION 1.0
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="app.js"></script>
</body>
</html>
